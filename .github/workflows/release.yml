name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
        run: |
          if [ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]; then
            echo "Commit $GITHUB_SHA is already released."
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          case "$COMMIT_MESSAGES" in
            *"#major"*) major=$((major + 1)); minor=0; patch=0 ;;
            *"#minor"*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac

          version="$major.$minor.$patch"
          echo "Releasing v$version (previous: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.version.outputs.version != ''
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Removing leftover draft $TAG from a failed run."
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Projekt $TAG" \
            --generate-notes \
            --notes "Download the installer for your operating system from the Assets below."

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Universal
            runs-on: macos-15
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
            extension: dmg
            asset_suffix: macos_universal.dmg
          - name: Windows x64
            runs-on: windows-2025
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
            asset_suffix: windows_x64-setup.exe
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          printf '{"version":"%s"}' "$VERSION" > "$RUNNER_TEMP/version.json"
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundle }} \
            --config "$RUNNER_TEMP/version.json"

      - name: Upload installer to release
        run: |
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}"
          shopt -s nullglob
          installers=("$bundle_dir"/*_"$VERSION"_*.${{ matrix.extension }})
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one installer in $bundle_dir, found ${#installers[@]}."
            ls -la "$bundle_dir" || true
            exit 1
          fi

          asset="$RUNNER_TEMP/Projekt_${VERSION}_${{ matrix.asset_suffix }}"
          cp "${installers[0]}" "$asset"
          gh release upload "v$VERSION" "$asset" --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish
        run: |
          gh release edit "v${{ needs.prepare.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
